# Arranjo 05 — A: ESM-2 OFF, B: ChemBERTa OFF, C: Reg/Semi ON
# A implementar em M4 (regularizadores + L_semi).
arrangement: "05"
name: semi
factors:
  esm2: off
  chemberta: off
  semi: on
command_flags:
  use_esm2: false
  use_chemberta: false
  semi: true
  yaware: true

model: Baseline

data:
  dataframe_path: data/pdbbind2020/index-pfam.csv
  root_dir: data/pdbbind2020/processed
  split_column: random_split
  target_column: pki   # rotulo em unidades de pK; delta_g = -1.364*pK
  merge_val_test: true
  protein_path_pattern: "{c}_protein_prep.pdb.pkl"
  ligand_path_pattern: "{c}_ligand_rnum.pdb.pkl"
  batch_size: 64
  num_workers: 8
  vox_size: 1.0
  box_dims: [24.0, 24.0, 24.0]
  view: ["VolumeView", "BasicView"]
  occupancy: gaussian
  random_rotation: true

train:
  max_epochs: 1500
  optimizer: AdamW
  lr: 0.00087469
  beta1: 0.25693012
  eps: 0.00032933
  dropout: 0.25348994
  wdecay: 0.0000169
  molecular_dropout: 0.06
  molecular_dropout_unit: complex
  # off: mantem o comportamento das runs ja medidas (embedding do parceiro
  # descartado continua intacto). on: zera e_prot/e_lig junto com o voxel.
  molecular_dropout_embeddings: false
  depthwise_convs: true
  adaptive_pooling: true
  lambda_semi: 0.1
